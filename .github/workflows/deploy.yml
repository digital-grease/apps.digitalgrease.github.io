name: Build and publish deploy artifact

# Pull model: CI builds and publishes a tarball to a rolling 'deploy' release
# using the ephemeral GITHUB_TOKEN. The VPS pulls + verifies it (see
# vps-edge/pull/). No SSH key or long-lived secret is stored in GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create/update the rolling 'deploy' release

concurrency:
  group: deploy-artifact
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Upgrade npm (cooldown support)
        # npm 11.10+ honors min-release-age from .npmrc. setup-node@v4
        # ships npm 10.x with current LTS, so upgrade explicitly.
        # See ../../COOLDOWNS.md.
        run: npm install -g 'npm@>=11.10'

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro + Pagefind index + OG cards)
        # `npm run build` = `astro build && pagefind --site dist`. The bare
        # `npx astro build` would ship NO /pagefind/ search index. OG cards are
        # generated by astro build itself (astro-og-canvas endpoint).
        run: npm run build

      - name: Package artifact
        run: |
          tar -czf "$RUNNER_TEMP/site.tar.gz" -C dist .
          sha256sum "$RUNNER_TEMP/site.tar.gz" | awk '{print $1}' > "$RUNNER_TEMP/site.tar.gz.sha256"

      - name: Publish to rolling 'deploy' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view deploy >/dev/null 2>&1 || \
            gh release create deploy --title "Deploy artifact" \
              --notes "Rolling build artifact pulled by the VPS." --latest=false
          gh release upload deploy \
            "$RUNNER_TEMP/site.tar.gz" "$RUNNER_TEMP/site.tar.gz.sha256" --clobber
